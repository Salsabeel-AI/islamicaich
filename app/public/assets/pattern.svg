<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" fill="none" viewBox="0 0 200 200">
  <desc>
    Lifted from examples/homePage/home.svg (paint14_linear_1350_27630, one motif of the
  8x8 ornament lattice). True lattice pitch is 199.5683px with a 0.117deg export rotation;
  the rotate() below removes that rotation and the outer scale() normalises the cell to a
  round 200 user units so mask-size:200px tiles it exactly. The nine copies exist so every shape
  that crosses a cell edge is repeated on the opposite edge and the seams close.

  width/height are 520 ON PURPOSE and are NOT the cell size. atic-pattern.png was 520x520
  and mask-size:auto is a real consumer of that intrinsic size: the .pattern-* demos in
  design-system section 05 leave mask-size unset. A viewBox-only SVG has no intrinsic size,
  which is what made the first SVG attempt silently rescale every one of those demos and get
  reverted. 520 outer over a 200 viewBox keeps one cell per 520px under mask-size:auto -
  byte-for-byte the PNG behaviour - while mask-size:200px still yields the true lattice pitch.
  </desc>
